{% extends 'base.html' %}
{% block title %}Data Dosen{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-person-badge-fill"></i> Data Dosen</h4>
    <a href="{% url 'dosen_create' %}" hx-get="{% url 'dosen_create' %}" hx-target="#main-content" hx-select="#main-content" hx-push-url="true" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Tambah Dosen
    </a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form method="get" hx-get="{% url 'dosen_list' %}" hx-target="#main-content" hx-select="#main-content" hx-push-url="true" class="mb-3">
            <div class="input-group">
                <input type="text" name="search" class="form-control" placeholder="Cari NIDN atau Nama..." value="{{ request.GET.search }}">
                <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Cari</button>
                {% if request.GET.search %}
                <a href="{% url 'dosen_list' %}" hx-get="{% url 'dosen_list' %}" hx-target="#main-content" hx-select="#main-content" hx-push-url="true" class="btn btn-outline-secondary">Reset</a>
                {% endif %}
            </div>
        </form>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>NIDN</th>
                        <th>Nama</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ d.nidn }}</td>
                        <td>{{ d.nama }}</td>
                        <td>
                            <a href="{% url 'dosen_update' d.id %}" hx-get="{% url 'dosen_update' d.id %}" hx-target="#main-content" hx-select="#main-content" hx-push-url="true" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <a href="{% url 'dosen_delete' d.id %}" hx-get="{% url 'dosen_delete' d.id %}" hx-target="#main-content" hx-select="#main-content" hx-push-url="true" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center">Tidak ada data</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
